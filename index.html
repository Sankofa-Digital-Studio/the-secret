<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><meta name="theme-color" content="#090313"><title>The Secret — Mobile Review Preview</title></head><body style="margin:0;background:#05020a;color:#f8f3fb;font-family:system-ui,sans-serif"><div id="boot" style="min-height:100svh;display:grid;place-items:center;padding:24px;text-align:center"><div><div style="font:700 12px/1 system-ui;letter-spacing:.18em;text-transform:uppercase;color:#d5b2ff">The Secret</div><p style="color:#c6b8cf">Opening preview…</p></div></div><script>(async()=>{try{const parts=await Promise.all([1,2,3,4,5].map(n=>fetch(`payload-${n}.txt`,{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error(`payload ${n}`);return r.text()})));const b64=parts.join('').trim();const bin=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));const ds=new DecompressionStream('gzip');let out=await new Response(new Blob([bin]).stream().pipeThrough(ds)).text();const scrollFix=`<style id="v8-scroll-fix">html,body{height:100%;overscroll-behavior:none}.story{touch-action:pan-x pan-y!important;overscroll-behavior-x:contain!important}.scene{touch-action:pan-x pan-y!important}.screen{overflow-y:auto!important;overflow-x:hidden!important;-webkit-overflow-scrolling:touch;overscroll-behavior-y:contain;scrollbar-width:thin}.copy,.final,.quiet,.opening{overflow-y:auto!important;-webkit-overflow-scrolling:touch;overscroll-behavior-y:contain}.gallery-screen .copy{min-height:0!important}.v8-nav{position:fixed;right:max(10px,env(safe-area-inset-right));bottom:max(12px,env(safe-area-inset-bottom));z-index:38;display:flex;gap:8px}.v8-nav button{width:44px;height:44px;padding:0;border-radius:50%;border:1px solid rgba(255,255,255,.22);background:rgba(8,4,13,.86);backdrop-filter:blur(12px);color:#fff;font-size:19px;box-shadow:0 10px 28px rgba(0,0,0,.35)}@media(max-width:760px){.screen{height:calc(100dvh - 58px)!important;max-height:calc(100dvh - 58px)!important}.gallery-screen{overflow:hidden!important}.gallery-screen .copy{overflow-y:auto!important;max-height:100%!important}.v8-nav{bottom:max(70px,calc(env(safe-area-inset-bottom) + 62px))}.review-drawer{overflow:hidden}.review-pane{overflow-y:auto!important}}@media(min-width:761px){.screen{overflow-y:auto!important}.copy{min-height:0}.story{scrollbar-width:none}.story::-webkit-scrollbar{display:none}}</style>`;const scrollJs=`<script id="v8-scroll-runtime">(()=>{const story=document.querySelector('.story');if(!story)return;const scenes=[...document.querySelectorAll('.scene')];let wheelLock=false;function activeIndex(){return Math.max(0,Math.min(scenes.length-1,Math.round(story.scrollLeft/Math.max(1,story.clientWidth))))}function go(delta){const i=Math.max(0,Math.min(scenes.length-1,activeIndex()+delta));scenes[i]?.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth',inline:'start',block:'nearest'})}function scrollableAncestor(el){for(let n=el;n&&n!==document.body;n=n.parentElement){const s=getComputedStyle(n);if(/auto|scroll/.test(s.overflowY)&&n.scrollHeight>n.clientHeight+2)return n}return null}story.addEventListener('wheel',e=>{if(Math.abs(e.deltaY)<=Math.abs(e.deltaX))return;const box=scrollableAncestor(e.target);if(box){const down=e.deltaY>0,canDown=box.scrollTop+box.clientHeight<box.scrollHeight-2,canUp=box.scrollTop>2;if((down&&canDown)||(!down&&canUp))return}e.preventDefault();if(wheelLock)return;wheelLock=true;go(e.deltaY>0?1:-1);setTimeout(()=>wheelLock=false,460)},{passive:false});const nav=document.createElement('div');nav.className='v8-nav';nav.innerHTML='<button type="button" aria-label="Previous screen">‹</button><button type="button" aria-label="Next screen">›</button>';nav.children[0].onclick=()=>go(-1);nav.children[1].onclick=()=>go(1);document.body.appendChild(nav);document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key==='PageDown')go(1);if(e.key==='ArrowLeft'||e.key==='PageUp')go(-1)});})();<\/script>`;out=out.replace('</head>',scrollFix+'</head>').replace('</body>',scrollJs+'</body>');document.open();document.write(out);document.close()}catch(e){document.getElementById('boot').innerHTML='<div><h1 style="font:2rem Georgia,serif">Preview could not open</h1><p style="color:#c6b8cf">Please refresh this page.</p></div>';console.error(e)}})();</script></body></html>
