<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><meta name="theme-color" content="#090313"><title>The Secret — Mobile Review Preview</title></head><body style="margin:0;background:#05020a;color:#f8f3fb;font-family:system-ui,sans-serif"><div id="boot" style="min-height:100svh;display:grid;place-items:center;padding:24px;text-align:center"><div><div style="font:700 12px/1 system-ui;letter-spacing:.18em;text-transform:uppercase;color:#d5b2ff">The Secret</div><p style="color:#c6b8cf">Opening preview…</p></div></div><script>(async()=>{try{const parts=await Promise.all([1,2,3,4,5].map(n=>fetch(`payload-${n}.txt`,{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error(`payload ${n}`);return r.text()})));const b64=parts.join('').trim();const bin=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));const ds=new DecompressionStream('gzip');const out=await new Response(new Blob([bin]).stream().pipeThrough(ds)).text();document.open();document.write(out);document.close()}catch(e){document.getElementById('boot').innerHTML='<div><h1 style="font:2rem Georgia,serif">Preview could not open</h1><p style="color:#c6b8cf">Please refresh this page.</p></div>';console.error(e)}})();</script></body></html>
